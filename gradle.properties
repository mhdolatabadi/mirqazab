# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Set connection and socket timeouts for HTTP
systemProp.http.connectionTimeout=120000
systemProp.http.socketTimeout=120000

# Set connection and socket timeouts for HTTPS
systemProp.https.connectionTimeout=120000
systemProp.https.socketTimeout=120000

# Specifically for Gradle's internal download mechanism
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000

javaBaseDocker=docker.arvancloud.ir/eclipse-temurin:17-jre-alpine

org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true
